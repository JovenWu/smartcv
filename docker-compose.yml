services:
  backend:
    build: .
    ports:
      # Host port 8000 is taken by another project on this machine.
      - "127.0.0.1:8001:8000"
    # backend/.env is the single source of configuration; copy
    # .env.example and fill it in. Do not re-add an `environment:` block:
    # compose interpolates it from ./.env and would override these values
    # with empty strings when that file is absent.
    env_file:
      - path: backend/.env
        required: false
    volumes:
      - smartcv-data:/app/backend/data
    restart: unless-stopped

volumes:
  smartcv-data:
