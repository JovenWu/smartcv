services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      SMARTCV_FAKE_EVALUATOR: ${SMARTCV_FAKE_EVALUATOR:-true}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev}
      WORKER_COUNT: ${WORKER_COUNT:-4}
      REVIEW_CONFIDENCE_THRESHOLD: ${REVIEW_CONFIDENCE_THRESHOLD:-0.5}
    volumes:
      - smartcv-data:/app/backend/data
    restart: unless-stopped

volumes:
  smartcv-data:
